</script><script data-wf>/* The page's core: data, walkthrough, trace, rebuild, and Git. No DOM here,
   so the tests run it under Node. Everything lives in one object, WF. */
var WF = (function () {
  "use strict";

  var DEFAULT_LANES = [
    { id: "sources", name: "Sources", kind: "sources", icon: "database" },
    { id: "me", name: "Me", kind: "me", icon: "user" },
    { id: "claude", name: "Claude", kind: "claude", icon: "sparkles" },
    { id: "other", name: "Someone or a script", kind: "other", icon: "cog" }
  ];
  var LANE_KINDS = ["sources", "me", "claude", "other"];
  var STATES = ["not tried", "tried", "works", "broken"];
  var KIND_ICON = { sources: "database", me: "user", claude: "sparkles", other: "cog" };
  var SOURCE_ICON = { "api": "globe", "download": "download", "by hand": "user", "someone else": "users" };
  var STEP_WORDS = [
    [/gather|collect|download|fetch|scrape|pull/i, "download"],
    [/tag|label|code|classif/i, "tag"],
    [/close.?read|read|annotat/i, "book-open"],
    [/write|draft|essay|argument/i, "pen-line"],
    [/compar|contrast|diff/i, "git-compare"],
    [/search|find|look up|query/i, "search"],
    [/edit|cut|trim|assembl/i, "scissors"],
    [/interview|record|listen/i, "mic"],
    [/transcri/i, "file-text"],
    [/watch|screen|view/i, "tv"],
    [/chart|plot|graph|visuali|map/i, "chart-column"],
    [/note/i, "notebook-pen"],
    [/publish|post|share|send/i, "send"],
    [/photo|image|frame|still/i, "image"],
    [/sort|filter|select|choose/i, "filter"],
    [/check|verify|review/i, "list-checks"],
    [/cite|quote/i, "quote"]
  ];

  function str(v) { return v === null || v === undefined ? "" : String(v); }
  function arr(v) {
    if (Array.isArray(v)) return v.map(str).filter(function (x) { return x !== ""; });
    return v === null || v === undefined || v === "" ? [] : [str(v)];
  }
  function isObj(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
  function slug(t) {
    var s = str(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 48);
    return s.replace(/-+$/, "") || "workflow";
  }
  function clone(v) { return JSON.parse(JSON.stringify(v)); }
  function low(v) { return str(v).trim().toLowerCase(); }

  function guessIcon(name, kind) {
    if (kind && SOURCE_ICON[kind]) return SOURCE_ICON[kind];
    for (var i = 0; i < STEP_WORDS.length; i++) if (STEP_WORDS[i][0].test(str(name))) return STEP_WORDS[i][1];
    return kind === undefined ? "workflow" : "database";
  }

  function laneForWho(who, lanes) {
    var w = low(who), work = lanes.filter(function (l) { return l.kind !== "sources"; });
    function byKind(k) { return work.filter(function (l) { return l.kind === k; })[0]; }
    var hit = (w === "me" && byKind("me")) || (w === "claude" && byKind("claude")) ||
      work.filter(function (l) { return low(l.name) === w && w !== ""; })[0] || byKind("other") ||
      work[work.length - 1];
    return hit ? hit.id : "other";
  }

  function whoForLane(lane, currentWho) {
    if (lane.kind === "me") return "me";
    if (lane.kind === "claude") return "Claude";
    var c = low(currentWho);
    return c === "a script" || c === "someone else" ? c : "someone else";
  }

  function normLanes(raw) {
    var lanes = (Array.isArray(raw) && raw.length ? raw : clone(DEFAULT_LANES)).filter(isObj).map(function (l) {
      var kind = LANE_KINDS.indexOf(l.kind) >= 0 ? l.kind : "other";
      var id = str(l.id) || slug(l.name);
      return Object.assign({}, l, { id: id, name: str(l.name) || id, kind: kind, icon: str(l.icon) || KIND_ICON[kind] });
    });
    var src = lanes.filter(function (l) { return l.kind === "sources"; })[0] || clone(DEFAULT_LANES[0]);
    var rest = lanes.filter(function (l) { return l.kind !== "sources"; });
    if (!rest.length) rest = clone(DEFAULT_LANES.slice(1));
    return [src].concat(rest);
  }

  function normalize(data) {
    var d = isObj(data) ? data : {};
    var m = Object.assign({}, d), problems = [];
    m.title = str(d.title) || "My workflow";
    m.question = str(d.question);
    m.begun = str(d.begun);
    m.id = d.id ? slug(d.id) : slug(m.title);
    m.kind = str(d.kind);
    var r = isObj(d.repo) ? d.repo : {};
    m.repo = Object.assign({}, r, { owner: str(r.owner), name: str(r.name), branch: str(r.branch) || "main" });
    var g = isObj(d.git) ? d.git : {};
    m.git = {
      pulled: str(g.pulled),
      committed: Math.max(0, Number(g.committed) || 0),
      pending: (Array.isArray(g.pending) ? g.pending : []).filter(isObj).map(function (p) {
        return { message: str(p.message), date: str(p.date), changes: arr(p.changes), snapshot: isObj(p.snapshot) ? p.snapshot : null };
      })
    };
    m.icons = isObj(d.icons) ? d.icons : {};
    m.lanes = normLanes(d.lanes);
    var laneIds = {};
    m.lanes.forEach(function (l) { laneIds[l.id] = l; });

    m.sources = (Array.isArray(d.sources) ? d.sources : []).filter(isObj).map(function (s) {
      var id = str(s.id);
      if (id.indexOf("src-") !== 0) id = "src-" + slug(id || s.name);
      return Object.assign({}, s, {
        id: id, name: str(s.name) || id.slice(4), kind: str(s.kind), link: str(s.link), gives: str(s.gives),
        icon: str(s.icon) || guessIcon(s.name, str(s.kind) || "other"), unsure: arr(s.unsure)
      });
    });

    var seen = {};
    m.steps = (Array.isArray(d.steps) ? d.steps : []).filter(isObj).map(function (s, i) {
      var c = s.check, check;
      if (isObj(c)) check = Object.assign({}, c, { by: str(c.by), how: str(c.how) });
      else check = { by: str(c), how: "" };
      var n = s.n === undefined || s.n === null || s.n === "" ? String(i + 1) : s.n;
      var key = String(n);
      if (seen[key]) problems.push("Two steps are numbered " + key + ".");
      seen[key] = true;
      var lane = laneIds[str(s.lane)] && laneIds[str(s.lane)].kind !== "sources" ? str(s.lane) : laneForWho(s.who, m.lanes);
      return Object.assign({}, s, {
        n: typeof n === "number" ? n : str(n), name: str(s.name), "in": str(s["in"]), out: str(s.out),
        who: str(s.who) || "UNSURE", check: check, run: str(s.run),
        state: STATES.indexOf(s.state) >= 0 ? s.state : "not tried",
        state_date: str(s.state_date), state_note: str(s.state_note),
        you_or_it: str(s.you_or_it) || "UNSURE", credited: str(s.credited) || "UNSURE",
        mine: s.mine === true, unsure: arr(s.unsure), lane: lane,
        col: typeof s.col === "number" && isFinite(s.col) ? s.col : i,
        icon: str(s.icon) || guessIcon(s.name)
      });
    });

    var nodes = {};
    m.sources.forEach(function (s) { nodes[s.id] = true; });
    m.steps.forEach(function (s) { nodes[String(s.n)] = true; });
    m.arrows = (Array.isArray(d.arrows) ? d.arrows : []).filter(isObj).map(function (a) {
      var o = Object.assign({}, a, { from: str(a.from), to: str(a.to), loop: a.loop === true, unsure: a.unsure === true, label: str(a.label) });
      if (!nodes[o.from] || !nodes[o.to]) {
        problems.push("The arrow from " + o.from + " to " + o.to + " joins a step or source that is not on the map.");
      }
      return o;
    });
    m.changes = (Array.isArray(d.changes) ? d.changes : []).map(function (c) {
      return isObj(c) ? Object.assign({}, c, { date: str(c.date), what: str(c.what) }) : { date: "", what: str(c) };
    });
    var RESULTS = ["works", "broken", "tried"], CHECKS = ["pass", "fail", "not checked"];
    m.runs = (Array.isArray(d.runs) ? d.runs : []).filter(isObj).map(function (r, i) {
      var c = isObj(r.check) ? r.check : {};
      return Object.assign({}, r, {
        id: str(r.id) || "run-" + (i + 1), date: str(r.date), step: str(r.step),
        round: Math.max(1, parseInt(r.round, 10) || 1), pass: Math.max(1, parseInt(r.pass, 10) || 1),
        result: RESULTS.indexOf(r.result) >= 0 ? r.result : "tried", note: str(r.note), outputs: arr(r.outputs),
        check: Object.assign({}, c, { by: str(c.by), result: CHECKS.indexOf(c.result) >= 0 ? c.result : "not checked", note: str(c.note) })
      });
    });
    var maxRound = m.runs.reduce(function (a, r) { return Math.max(a, r.round); }, 1);
    m.round = Math.max(maxRound, parseInt(d.round, 10) || 1);
    m.problems = problems;
    return m;
  }

  /* ---------- runs: what each step did ---------- */

  function recordRun(model, key, run, date) {
    var m = normalize(clone(stripInternal(model)));
    var r = isObj(run) ? run : {}, k = str(key);
    var s = m.steps.filter(function (x) { return String(x.n) === k; })[0];
    if (!s) return m;
    var round = m.round;
    var pass = m.runs.filter(function (x) { return x.step === k && x.round === round; }).length + 1;
    var ids = {}, n = m.runs.length + 1;
    m.runs.forEach(function (x) { ids[x.id] = true; });
    while (ids["run-" + n]) n++;
    var when = str(date) || today();
    var entry = normalize({ runs: [{ id: "run-" + n, date: when, step: k, round: round, pass: pass,
      result: r.result, note: r.note, outputs: r.outputs, check: r.check }] }).runs[0];
    m.runs.push(entry);
    s.state = entry.result; s.state_date = when; s.state_note = entry.note;
    m.changes.unshift({ date: when, what: "ran step " + k + (pass > 1 ? " (pass " + pass + ")" : "") + ": " +
      entry.result + (entry.note ? ", " + entry.note : "") });
    return m;
  }

  function newRound(model, date) {
    var m = normalize(clone(stripInternal(model)));
    m.round += 1;
    m.changes.unshift({ date: str(date) || today(), what: "started round " + m.round });
    return m;
  }

  function runsFor(model, key) {
    var k = str(key), groups = {};
    model.runs.forEach(function (r) {
      if (r.step !== k) return;
      (groups[r.round] = groups[r.round] || []).push(r);
    });
    return Object.keys(groups).map(Number).sort(function (a, b) { return b - a; }).map(function (round) {
      return { round: round, runs: groups[round].slice().sort(function (a, b) { return a.pass - b.pass; }) };
    });
  }

  function rounds(model) {
    var seen = {};
    model.runs.forEach(function (r) { seen[r.round] = true; });
    return Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
  }

  /* The real runs of one round, in the order they were recorded, as the same
     events the walkthrough plays: an edge along the arrow that led there
     (a loop arrow when the step comes round again), then the visit. */
  function runEvents(model, round) {
    var rr = model.runs.filter(function (r) { return r.round === round; });
    var events = [], isSource = {}, seenStep = {}, prev = null;
    model.sources.forEach(function (s) { isSource[s.id] = true; });
    var fromSources = model.arrows.filter(function (a) { return isSource[a.from]; });
    var used = {};
    fromSources.forEach(function (a) {
      if (rr.some(function (r) { return r.step === a.to; }) && !used[a.from]) {
        used[a.from] = true;
        events.push({ kind: "visit", node: a.from, pass: 1 });
      }
    });
    rr.forEach(function (r) {
      fromSources.forEach(function (a) {
        if (a.to === r.step && !seenStep[r.step]) events.push({ kind: "edge", from: a.from, to: a.to, label: a.label, loop: false });
      });
      if (prev !== null) {
        var arrow = model.arrows.filter(function (a) { return a.from === prev && a.to === r.step; })[0];

    var g = wrapEl.querySelector('.card[data-node="' + cssEsc(ev.node) + '"]');
    if (g) { g.classList.remove("hit"); void g.getBoundingClientRect(); g.classList.add("hit"); }
    var row = (S.walk.kind === "runs" ? WF.runTrace(M(), [ev]) : WF.trace(M(), [ev]))[0];
    var badge = wrapEl.querySelector('.badge[data-badge="' + cssEsc(ev.node) + '"]');
    if (badge && row) {
      var kind = row.result === "fail" ? "fail" : row.warnings.length ? "warn" : row.result === "pass" ? "pass" : "none";
      badge.setAttribute("class", "badge show b-" + kind);
      badge.querySelector("text").textContent = ev.pass > 1 ? String(ev.pass) : { pass: "\u2713", fail: "\u2715", warn: "!", none: "\u2022" }[kind];
    }
    renderTrace();
  }
  function replayMarks() {
    var w = S.walk;
    w.events.slice(0, w.i).forEach(function (ev) {
      if (ev.kind === "edge") {
        var k = edgeIndex(ev), pill = wrapEl.querySelector('.pill[data-pill="' + k + '"]');
        if (pill) pill.classList.add("show");
      }
    });
    var visits = w.visits;
    w.visits = [];
    visits.forEach(showVisit);
  }
  function animateEdge(ev, done) {
    var k = edgeIndex(ev), path = wrapEl.querySelector("#wf-edge-" + k), dot = wrapEl.querySelector(".dot");
    if (!path || !dot) { done(); return; }
    var len = path.getTotalLength(), t0 = null, dur = reduceMotion() ? 1 : 650;
    var color = getComputedStyle(wrapEl.querySelector('.card[data-node="' + cssEsc(ev.from) + '"]') || path).getPropertyValue("--lane") || "";
    dot.style.fill = color.trim() || "";
    path.classList.add("lit");
    function frame(ts) {
      if (!S.walk) return;
      if (t0 === null) t0 = ts;
      var f = Math.min(1, (ts - t0) / dur), pt = path.getPointAtLength(len * f);
      dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
      if (f < 1) { S.walk.raf = requestAnimationFrame(frame); return; }
      var pill = wrapEl.querySelector('.pill[data-pill="' + k + '"]');
      if (pill) pill.classList.add("show");
      path.classList.remove("lit");
      done();
    }
    S.walk.raf = requestAnimationFrame(frame);
  }
  function reduceMotion() { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  function advance(untilVisit, onDone) {
    var w = S.walk;
    if (!w || w.i >= w.events.length) { onDone && onDone(true); return; }
    var ev = w.events[w.i++];
    if (ev.kind === "edge") {
      animateEdge(ev, function () { advance(untilVisit, onDone); });
    } else {
      showVisit(ev);
      if (untilVisit) { onDone && onDone(w.i >= w.events.length); return; }
      setTimeout(function () { if (S.walk === w && w.playing) advance(false, onDone); }, reduceMotion() ? 50 : 420);
    }
  }
  function togglePlay() {
    if (S.walk && S.walk.playing) { S.walk.playing = false; btn.play.textContent = "\u25b6 Play"; return; }
    if (!S.walk || S.walk.i >= S.walk.events.length) { resetWalk(); S.walk = newWalk(); }
    S.walk.playing = true;
    btn.play.textContent = "\u275a\u275a Pause";
    (function go() {
      advance(true, function (finished) {
        if (!S.walk) return;
        if (finished) { S.walk.playing = false; btn.play.textContent = "\u25b6 Play again"; return; }
        if (S.walk.playing) setTimeout(go, reduceMotion() ? 50 : 420);
      });
    })();
  }
  function stepOnce() {
    if (S.walk && S.walk.playing) { S.walk.playing = false; btn.play.textContent = "\u25b6 Play"; }
    if (!S.walk || S.walk.i >= S.walk.events.length) { resetWalk(); S.walk = newWalk(); }
    advance(true, function () {
      var v = S.walk && S.walk.visits[S.walk.visits.length - 1];
      if (v) select(v.node);
    });
  }

  /* ---------- trace ---------- */
  function renderTrace() {
    traceEl.innerHTML = "";
    var kind0 = S.walk ? S.walk.kind : walkKind();
    traceEl.appendChild(h("div", { "class": "trace-head" }, [
      h("h2", { text: "Debug trace" }),
      h("span", { "class": "trace-kind", text: kind0 === "runs" ? "Round " + currentRound() + ": what happened" : "Walkthrough (planned checks)" })]));
    var visits = S.walk ? S.walk.visits : [];
    var rows;
    if (kind0 === "runs") {
      rows = WF.runTrace(M(), S.walk ? visits : WF.runEvents(M(), currentRound()));
    } else {
      if (!visits.length) {
        traceEl.appendChild(h("p", { "class": "hint", text: S.mode === "view"
          ? "No runs recorded in this round yet. Press Play to walk through the plan, or open a step and record a run."
          : "Press Play or Step. Each step's check appears here as the walkthrough reaches it." }));
        return;
      }
      rows = WF.trace(M(), visits);
    }
    var list = h("ol", { "class": "trace-rows" });
    rows.forEach(function (r) {
      var kind = r.result === "fail" ? "fail" : r.warnings.length ? "warn" : r.result === "pass" ? "pass" : "none";
      var by = String(r.check.by || "");
      var check = r.source || !by || by.toUpperCase() === "UNSURE" ? "" : "checked by " + by + (r.check.how ? ": " + r.check.how : "");
      var li = h("li", { "class": "trace-row r-" + kind, tabindex: "0", style: "--lane:" + WF.laneColor(M(), r.lane) }, [
        h("span", { "class": "mark", text: { pass: "\u2713", fail: "\u2715", warn: "!", none: "\u2022" }[kind] }),
        h("span", { "class": "t-step", text: (r.pass > 1 ? "\u21ba " : "") + (r.source ? r.name : r.node + " " + r.name) + (r.pass > 1 ? " (pass " + r.pass + ")" : "") }),
        h("span", { "class": "t-out", text: (r.date ? r.date + "  " : "") + (r.out ? "out: " + r.out : "") }),
        h("span", { "class": "t-check", text: [r.note || "", check].concat(r.warnings).filter(Boolean).join(" \u00b7 ") })
      ]);
      li.addEventListener("click", function () { select(r.node); });
      list.appendChild(li);
    });
    traceEl.appendChild(list);
  }

  /* ---------- change log ---------- */
  function renderLog() {
    logEl.innerHTML = "";
    logEl.appendChild(h("h2", { text: "Change log" }));
    var items = M().changes.slice(0, 40);
    if (!items.length) { logEl.appendChild(h("p", { "class": "hint", text: "No changes yet." })); return; }
    var committedFrom = WF.uncommitted(M());
    logEl.appendChild(h("ul", {}, items.map(function (c, i) {
      return h("li", { "class": i < committedFrom && S.level >= 3 ? "uncommitted" : "" }, [h("span", { "class": "date", text: c.date }), " ", c.what]);
    })));
  }

  /* ---------- saving ---------- */
  async function save() {
    flushEdits();
    if (S.level < 2 || S.readOnly || S.saving) { renderStatus(); return false; }
    S.saving = true;
    statusEl.textContent = "saving\u2026";
    stash();
    try {
      await S.artifact.publish(pageHtml(M()));
      S.dirty = false;
      return true;
    } catch (e) {
      var code = e && e.code;
      if (code === "conflict") { toast("Reloaded to a newer version."); }
      else if (code === "not_writer" || code === "not_granted") { S.readOnly = true; renderAll(); toast("You can look at this map but not change it."); }
      else toast("Not saved: " + ((e && e.message) || code || "unknown error"));
      return false;
    } finally { S.saving = false; renderStatus(); }
  }
  function copyMap() {
    flushEdits();
    copyText(WF.serializeData(M())).then(function (ok) {
      toast(ok ? "Copied. Paste it into the chat and ask Claude to keep it." : "Could not copy. Select the change log and copy by hand.");
    });
  }

  /* ---------- Git ---------- */
  function gh() { return WF.makeAdapter(S.mcp, WF.connectorConfig(M().connector)); }
  async function refreshHead() {
    if (S.level < 3) return;
    try { S.head = await gh().head(M().repo); S.gitMsg = ""; }
    catch (e) { S.gitMsg = "GitHub: " + ((e && e.message) || (e && e.code) || "no answer"); }
    renderStatus();
  }
  async function doCommit() {
    flushEdits();
    renormalize();
    var msg = commitInput.value.trim();
    if (!msg) { toast("Write a commit message first."); commitInput.focus(); return; }
    S.model = WF.commit(M(), msg);
    commitInput.value = ""; commitInput.dataset.auto = "1";
    S.dirty = true;
    renderAll();
    if (await save()) toast("Committed on the page. Push to send it to GitHub.");
  }
  async function doPush() {
    flushEdits();
    S.gitMsg = "pushing\u2026"; renderStatus();
    var res = await WF.push(M(), gh(), pageHtml);
    S.gitMsg = "";
    if (!res.ok) { toast(res.message); await refreshHead(); return; }
    S.model = res.model; S.head = res.model.git.pulled; S.dirty = true;
    renderAll();
    toast(res.message);
    await save();
  }
  async function doPull() {
    flushEdits();
    S.gitMsg = "pulling\u2026"; renderStatus();
    var res = await WF.pull(M(), gh());
    S.gitMsg = "";
    if (!res.ok) { toast(res.message); renderStatus(); return; }
    if (res.choice) { S.choice = res.choice; renderChoice(); toast(res.message); return; }
    S.model = res.model; S.head = res.model.git.pulled; S.dirty = true;
    renderAll();
    toast(res.message);
    await save();
  }
  function renderChoice() {
    gitPanel.innerHTML = "";
    var c = S.choice;
    gitPanel.hidden = !c;
    if (!c) return;
    function side(title, m, which) {
      return h("div", { "class": "side" }, [h("h3", { text: title }),
        h("ul", {}, m.changes.slice(0, 6).map(function (x) { return h("li", { text: x.date + "  " + x.what }); })),
        h("button", { type: "button", "class": "btn", onclick: async function () {
          S.model = WF.keepAfterChoice(c, which); S.choice = null; S.head = c.theirs.git.pulled; S.dirty = true;
          renderAll(); renderChoice(); await save();
        } }, [which === "mine" ? "Keep the page's" : "Keep the repository's"])]);
    }
    gitPanel.appendChild(h("p", { text: "The page and the repository have both changed since you last pulled. Keep one; the other is noted in the change log. After keeping the page's, push to replace the repository's copy." }));
    gitPanel.appendChild(h("div", { "class": "sides" }, [side("On this page", c.mine, "mine"), side("In the repository", c.theirs, "theirs")]));
    gitPanel.appendChild(h("button", { type: "button", "class": "btn small", onclick: function () { S.choice = null; renderChoice(); } }, ["Not now"]));
  }

  async function checkGithub() {
    checkEl.hidden = false;
    checkEl.innerHTML = "";
    checkEl.appendChild(h("p", { text: "Checking GitHub\u2026 (this reads only; it changes nothing)" }));
    var mcp = S.mcp;
    if (!mcp && window.claude && typeof window.claude.use === "function") {
      try { mcp = await withTimeout(window.claude.use("mcp"), 10000); } catch (e) { mcp = null; }
    }
    var res = await WF.checkGithub(mcp, M());
    checkEl.innerHTML = "";
    checkEl.className = "gh-check " + (res.ok ? "ok" : "bad");
    checkEl.appendChild(h("div", { "class": "gh-head" }, [
      h("strong", { text: res.ok ? "GitHub works from this page." : "GitHub is not ready on this page." }),
      h("button", { type: "button", "class": "btn small", onclick: function () { checkEl.hidden = true; } }, ["Close"])]));
    checkEl.appendChild(h("ul", {}, res.lines.map(function (l) {
      return h("li", { "class": l.ok ? "yes" : "no" }, [h("span", { "class": "mark", text: l.ok ? "\u2713" : "\u2715" }),
        h("span", { "class": "lbl", text: l.label }), h("span", { "class": "det", text: l.detail })]);
    })));
    if (!res.ok) checkEl.appendChild(h("p", { "class": "hint", text: "Without GitHub, Save still keeps your map on this page; commit and push workflow/ from the terminal." }));
    if (res.ok && mcp && S.artifact && S.level < 3) { S.mcp = mcp; S.level = 3; renderAll(); await refreshHead(); }
  }

  /* ---------- everything ---------- */
  function renderAll() {
    renderModes();
    renderHeader(); renderBanner(); renderProblems(); renderCanvas(); renderTrace(); renderPanel(); renderLog(); renderStatus();
  }

  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
    if (e.key === "Escape" && S.selected) select(null);
  });
  window.addEventListener("beforeunload", function (e) {
    if (S.level >= 2 && !S.saving && (S.dirty || Object.keys(S.edits).length)) { e.preventDefault(); e.returnValue = ""; }
  });

  renderToolbar();
  var back = unstash();
  if (back && back.selected) S.selected = back.selected;
  if (back && (back.mode === "view" || back.mode === "edit")) S.mode = back.mode;
  if (back && back.round) S.viewRound = back.round;
  renderAll();
  if (back && back.scroll) wrapEl.scrollLeft = back.scroll;

  function withTimeout(p, ms) {
    return Promise.race([p, new Promise(function (r) { setTimeout(function () { r(null); }, ms); })]);
  }
  (async function connect() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") { renderAll(); return; }
    try { S.artifact = await withTimeout(c.use("artifact"), 10000); } catch (e) { S.artifact = null; }
    if (S.artifact) S.level = 2;
    if (S.artifact && M().repo.owner && M().repo.name) {
      try { S.mcp = await withTimeout(c.use("mcp"), 10000); } catch (e) { S.mcp = null; }
      if (S.mcp) S.level = 3;
    }
    renderAll();
    await refreshHead();
  })();
})(WF);
</script>
