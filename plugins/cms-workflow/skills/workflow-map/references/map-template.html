<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow map</title>
<style>
:root {
  --bg: #fbfaf7; --card: #ffffff; --ink: #1d1d1b; --muted: #66645e; --line: #dedbd2;
  --accent: #2f5d8a; --mine: #2e7d4f; --unsure-bg: #fff3c4; --unsure-ink: #6b4e00;
  --works: #2e7d4f; --broken: #b3261e; --tried: #8a6d00; --nottried: #66645e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --card: #22221f; --ink: #ecebe6; --muted: #a3a199; --line: #3a3934;
    --accent: #8ab4e0; --mine: #7fcf9c; --unsure-bg: #4a3d0c; --unsure-ink: #ffe28a;
    --works: #7fcf9c; --broken: #ff8a80; --tried: #e6c65c; --nottried: #a3a199;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --card: #22221f; --ink: #ecebe6; --muted: #a3a199; --line: #3a3934;
  --accent: #8ab4e0; --mine: #7fcf9c; --unsure-bg: #4a3d0c; --unsure-ink: #ffe28a;
  --works: #7fcf9c; --broken: #ff8a80; --tried: #e6c65c; --nottried: #a3a199;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  overflow-wrap: anywhere; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 6px; }
.question { font-size: 1.05rem; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px; }
.step { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; margin: 0 0 6px; }
.step h2 { font-size: 1.1rem; margin: 0 0 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.num { color: var(--accent); font-variant-numeric: tabular-nums; }
.badge { font-size: 0.75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.badge.mine { color: var(--mine); }
.state-works { color: var(--works); } .state-broken { color: var(--broken); }
.state-tried { color: var(--tried); } .state-not-tried { color: var(--nottried); }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; }
dt { color: var(--muted); font-size: 0.9rem; }
dd { margin: 0; }
@media (max-width: 520px) { dl { grid-template-columns: minmax(0, 1fr); } dt { margin-top: 6px; } }
pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; margin: 0; font-size: 0.9rem; }
.unsure { background: var(--unsure-bg); color: var(--unsure-ink); border-radius: 4px; padding: 0 4px; font-weight: 600; }
.unsure-list { margin: 10px 0 0; padding: 8px 12px; background: var(--unsure-bg); color: var(--unsure-ink); border-radius: 6px; }
.unsure-list ul { margin: 4px 0 0; padding-left: 20px; }
.arrows { color: var(--muted); font-size: 0.9rem; margin: 0 0 16px 16px; }
.from { color: var(--muted); font-size: 0.9rem; margin: -4px 0 8px; }
.arrows .loop { color: var(--accent); font-weight: 600; }
h3 { font-size: 1rem; margin: 32px 0 8px; }
.changes { padding-left: 20px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main id="map"></main>
<script type="application/json" id="workflow">
{
  "title": "My research workflow",
  "question": "The research question, one line, from the thesis.",
  "begun": "2026-11-18",
  "steps": [
    {
      "n": 1,
      "name": "First step",
      "in": "What goes in",
      "out": "What comes out",
      "who": "me",
      "check": {"by": "me", "how": "One sentence a person could follow."},
      "run": "What I would ask Cowork, or: by hand.",
      "state": "not tried",
      "state_date": "",
      "state_note": "",
      "you_or_it": "UNSURE",
      "credited": "UNSURE",
      "mine": true,
      "unsure": ["Is Claude a you or an it here, and who is credited?"]
    },
    {
      "n": 2,
      "name": "Second step",
      "in": "What step 1 made",
      "out": "What comes out",
      "who": "Claude",
      "check": {"by": "me", "how": "One sentence a person could follow."},
      "run": "What I would ask Cowork.",
      "state": "not tried",
      "state_date": "",
      "state_note": "",
      "you_or_it": "UNSURE",
      "credited": "UNSURE",
      "mine": false,
      "unsure": ["Is Claude a you or an it here, and who is credited?"]
    }
  ],
  "arrows": [
    {"from": 1, "to": 2, "loop": false},
    {"from": 2, "to": 1, "loop": true}
  ],
  "changes": [
    {"date": "2026-11-18", "what": "Map started."}
  ]
}
</script>
<script>
function esc(v) {
  return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function val(v) {
  var s = esc(v);
  return s.indexOf("UNSURE") === -1 ? s : s.replace(/UNSURE/g, '<span class="unsure">UNSURE</span>');
}
function list(v) { return v == null || v === "" ? [] : [].concat(v); }
function key(v) { return String(v == null ? "" : v).trim(); }
function isLoop(a, order) {
  if (a.loop === true) return true;
  var f = order[key(a.from)], t = order[key(a.to)];
  return f !== undefined && t !== undefined && t <= f;
}
function arrowText(a, order) {
  var mark = a.unsure === true ? ' <span class="unsure">UNSURE</span>' : '';
  return (isLoop(a, order) ? '<span class="loop">&#8634; loops back to ' + val(a.to) + '</span>'
    : '&darr; goes to ' + val(a.to)) + mark;
}
function renderWorkflow(d) {
  var steps = list(d.steps), arrows = list(d.arrows), changes = list(d.changes), order = {};
  steps.forEach(function (s, i) { order[key(s.n)] = i; });
  var h = '<h1>' + val(d.title) + '</h1>';
  h += '<p class="question">' + val(d.question) + '</p>';
  h += '<p class="meta">Begun ' + esc(d.begun) + ' &middot; ' + steps.length + ' steps</p>';
  steps.forEach(function (s) {
    var state = s.state || "not tried";
    var chk = typeof s.check === "string" ? {by: s.check} : (s.check || {});
    var into = arrows.filter(function (a) { return key(a.to) === key(s.n); });
    h += '<section class="step" id="step-' + esc(s.n) + '">';
    h += '<h2><span class="num">' + esc(s.n) + '.</span> ' + val(s.name);
    if (s.mine === true) h += ' <span class="badge mine">mine</span>';
    h += ' <span class="badge state-' + esc(state).replace(/ /g, "-") + '">' + esc(state) + '</span></h2>';
    if (into.length) h += '<p class="from">comes from ' + into.map(function (a) { return val(a.from); }).join(', ') + '</p>';
    h += '<dl>';
    h += '<dt>In</dt><dd>' + val(s.in) + '</dd>';
    h += '<dt>Out</dt><dd>' + val(s.out) + '</dd>';
    h += '<dt>Who does it</dt><dd>' + val(s.who) + '</dd>';
    h += '<dt>Who checks it</dt><dd>' + val(chk.by) + (chk.how ? ': ' + val(chk.how) : '') + '</dd>';
    h += '<dt>Run it in Cowork</dt><dd><pre>' + val(s.run) + '</pre></dd>';
    h += '<dt>Last run</dt><dd>' + (s.state_date ? esc(s.state_date) + ': ' : '') + (val(s.state_note) || esc(state)) + '</dd>';
    h += '<dt>Claude here is</dt><dd>' + (s.you_or_it === "you" ? 'a &ldquo;you&rdquo;' : s.you_or_it === "it" ? 'an &ldquo;it&rdquo;' : val(s.you_or_it)) + '</dd>';
    h += '<dt>Credited</dt><dd>' + val(s.credited) + '</dd>';
    h += '</dl>';
    var doubts = list(s.unsure);
    if (doubts.length) {
      h += '<div class="unsure-list"><strong>Still UNSURE</strong><ul>';
      doubts.forEach(function (u) { h += '<li>' + esc(u) + '</li>'; });
      h += '</ul></div>';
    }
    h += '</section>';
    var out = arrows.filter(function (a) { return key(a.from) === key(s.n); });
    h += '<p class="arrows">' + (out.length ? out.map(function (a) { return arrowText(a, order); }).join(' &middot; ') : 'ends here') + '</p>';
  });
  var stray = arrows.filter(function (a) {
    var fromSource = String(key(a.from)).indexOf("src-") === 0;
    return (order[key(a.from)] === undefined && !fromSource) || order[key(a.to)] === undefined;
  });
  if (stray.length) {
    h += '<div class="unsure-list"><strong>UNSURE arrows</strong> (a step they name is not on the map)<ul>';
    stray.forEach(function (a) { h += '<li>' + esc(a.from) + ' to ' + esc(a.to) + '</li>'; });
    h += '</ul></div>';
  }
  h += '<h3>Changes</h3><ul class="changes">';
  changes.forEach(function (c) { h += '<li>' + esc(c && c.date) + ': ' + val(c && c.what) + '</li>'; });
  h += '</ul>';
  return h;
}
function loadWorkflow(text) {
  try {
    return renderWorkflow(JSON.parse(text));
  } catch (e) {
    return '<div class="unsure-list"><strong>The map\'s data has an error:</strong> ' + esc(e.message) +
      '. Ask Claude to fix the JSON block.</div>';
  }
}
if (typeof document !== "undefined" && document) {
  var text = document.getElementById("workflow").textContent;
  try { document.title = JSON.parse(text).title || "Workflow map"; } catch (e) {}
  document.getElementById("map").innerHTML = loadWorkflow(text);
}
</script>
</body>
</html>
